name: Mantener despierto

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el servicio
        run: |
          url="https://interes-compuesto-ci43.onrender.com"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url/")
          echo "GET / -> HTTP $code"
          if [ "$code" != "200" ]; then exit 1; fi
